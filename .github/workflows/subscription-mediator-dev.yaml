# Builds subscription-mediator and publishes a multi-arch image to the dev
# Docker repository in JFrog Artifactory.
#
#   pull request → vet, test, govulncheck, and a multi-arch build that is not pushed
#   push to main → verify, then build linux/amd64 + linux/arm64 and push to Artifactory
#   manual run   → same as a push to main, for the selected branch
#
# Artifactory sign-in is GitHub OIDC (no stored password): the run's GitHub
# token is exchanged for a short-lived Artifactory token through an OpenID
# Connect integration and its identity mapping. Where OIDC isn't set up, a
# scoped access token can be used instead. Settings on the `dev` GitHub
# environment:
#
#   vars.DEV_REGISTRY          <artifactory host>/<docker repo key>[/<path>],
#                              e.g. mycompany.jfrog.io/docker-dev/api-platform
#   vars.JFROG_URL             e.g. https://mycompany.jfrog.io
# and either (OIDC, preferred):
#   vars.JFROG_OIDC_PROVIDER   name of the OIDC integration in Artifactory
#   vars.JFROG_OIDC_AUDIENCE   optional; the audience that integration expects
# or (access token):
#   vars.JFROG_USERNAME        the Artifactory user the token belongs to
#   secrets.JFROG_ACCESS_TOKEN scoped access token with deploy rights on the repository
#
# Tags pushed: sha-<short commit> (immutable, deploy by this or by digest) and
# dev (moves to the newest main build; the CI user needs Delete/Overwrite).
#
# Actions are pinned to commit SHAs; the comment beside each is the release.

name: subscription-mediator (dev)

on:
  push:
    branches: [main]
    paths:
      - "subscription-mediator/**"
      - ".github/workflows/subscription-mediator-dev.yaml"
  pull_request:
    paths:
      - "subscription-mediator/**"
      - ".github/workflows/subscription-mediator-dev.yaml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. Pull request runs are superseded by newer pushes;
# publishing runs are never cancelled partway through a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: subscription-mediator
  PLATFORMS: linux/amd64,linux/arm64
  GOVULNCHECK_VERSION: v1.9.0

defaults:
  run:
    working-directory: subscription-mediator

jobs:
  verify:
    name: Vet, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: subscription-mediator/go.mod
          cache-dependency-path: subscription-mediator/go.sum

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Fails the build on any vulnerability the code can reach, including the
      # Go standard library of the toolchain go.mod selects.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  # Pull requests prove the Dockerfile builds for every platform, without
  # registry access: no environment, no OIDC token, nothing pushed.
  build-check:
    name: Build image (no push)
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: subscription-mediator
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha,scope=subscription-mediator

  publish:
    name: Build and push to dev Artifactory
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The `dev` environment holds the registry settings, and its protection
    # rules (e.g. deployment branches: main) gate who can push.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check registry settings
        id: registry
        env:
          REPO: ${{ vars.DEV_REGISTRY }}
          JFROG_URL: ${{ vars.JFROG_URL }}
          OIDC_PROVIDER: ${{ vars.JFROG_OIDC_PROVIDER }}
          JFROG_USERNAME: ${{ vars.JFROG_USERNAME }}
          HAS_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN != '' }}
        run: |
          [ -n "$REPO" ] || { echo "::error::vars.DEV_REGISTRY is not set on the dev environment"; exit 1; }
          host=${REPO%%/*}
          if [ "$host" = "$REPO" ] || [[ "$host" == *://* ]]; then
            echo "::error::vars.DEV_REGISTRY must be <artifactory host>/<docker repo key>[/<path>] without a scheme, got '$REPO'"
            exit 1
          fi
          if [ -n "$OIDC_PROVIDER" ]; then
            [ -n "$JFROG_URL" ] || { echo "::error::vars.JFROG_URL is required for OIDC sign-in"; exit 1; }
          elif [ -z "$JFROG_USERNAME" ] || [ "$HAS_ACCESS_TOKEN" != "true" ]; then
            echo "::error::set vars.JFROG_OIDC_PROVIDER (OIDC), or vars.JFROG_USERNAME and secrets.JFROG_ACCESS_TOKEN"
            exit 1
          fi
          echo "host=$host" >> "$GITHUB_OUTPUT"

      # Exchanges this run's GitHub OIDC token for a short-lived Artifactory
      # token, as configured by the OIDC integration and its identity mapping.
      - name: Sign in to JFrog with OIDC
        id: jfrog
        if: vars.JFROG_OIDC_PROVIDER != ''
        uses: jfrog/setup-jfrog-cli@ad1052fd1b866ba57235228e8cc8997cf968fc4b # v4.12.0
        env:
          JF_URL: ${{ vars.JFROG_URL }}
        with:
          oidc-provider-name: ${{ vars.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}

      - name: Log in to dev registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ steps.jfrog.outputs.oidc-user || vars.JFROG_USERNAME }}
          password: ${{ steps.jfrog.outputs.oidc-token || secrets.JFROG_ACCESS_TOKEN }}

      # The Go build cross-compiles natively; QEMU only runs the arm64 runtime
      # stage's RUN steps (apk add, adduser, mkdir/chown).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotate the multi-arch index too, not only each platform's
          # manifest, so registries show the metadata on the tag itself.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ vars.DEV_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=dev
          labels: |
            org.opencontainers.image.title=subscription-mediator
            org.opencontainers.image.description=Bridges WSO2 API Portal webhook events to the WSO2 API Platform Gateway

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: subscription-mediator
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=subscription-mediator
          cache-to: type=gha,mode=max,scope=subscription-mediator

      - name: Summary
        env:
          REGISTRY: ${{ vars.DEV_REGISTRY }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Pushed to ${REGISTRY}"
            echo ""
            echo "Digest: \`${DIGEST}\`"
            echo ""
            echo "Tags:"
            echo "${TAGS}" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
