{{- if .Values.podDisruptionBudget.enabled }}
# Keeps a drain or cluster upgrade from taking every replica down at once: the
# API Portal never redelivers a webhook, so a delivery that finds no pod fails.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "subscription-mediator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "subscription-mediator.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "subscription-mediator.selectorLabels" . | nindent 6 }}
{{- end }}
