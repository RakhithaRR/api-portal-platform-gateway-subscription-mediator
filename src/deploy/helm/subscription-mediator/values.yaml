# Default values for subscription-mediator.
#
# The mediator keeps no state: every lookup reads the gateway, and each
# webhook is applied before the portal is answered. It runs as a Deployment,
# and any replica can take any delivery.

nameOverride: ""
fullnameOverride: ""

image:
  # Registry and repository, e.g.
  # mycompany.jfrog.io/docker-dev/api-platform/subscription-mediator
  # (<artifactory host>/<docker repo key>/<path>/subscription-mediator).
  repository: ""
  # Pin an immutable tag: the sha-<commit> tag CI pushes. A moving tag such as
  # `dev` lets a pod restart silently pick up a different build.
  tag: ""
  # Optional image digest (sha256:...). When set it takes precedence over tag,
  # which is then kept only as a human-readable hint.
  digest: ""
  pullPolicy: IfNotPresent

# Needed when the registry requires sign-in, as the Artifactory Docker
# repository does. Create a docker-registry Secret from a pull-only user or
# token (Read on the repository) in the release namespace:
#   kubectl -n <ns> create secret docker-registry artifactory-pull \
#     --docker-server=<artifactory host> --docker-username=<user> --docker-password=<token>
imagePullSecrets: []
#  - name: artifactory-pull

# --- Configuration ----------------------------------------------------------
# Rendered into config.toml in a ConfigMap. Credentials never go here; see
# `secret` below.
config:
  gateway:
    # The Gateway Controller management REST API. In the same cluster, use the
    # controller Service's DNS name:
    #   http://<release>-gateway-controller.<namespace>.svc:9090/api/management/v1
    # The gateway 1.2.0 controller serves it over plain HTTP only and has no TLS
    # listener; use an https address only for a TLS-terminating proxy or ingress
    # in front of it, whose certificate must name that host.
    # Match networkPolicy.egress.rules to the port (9090, or the proxy's).
    baseUrl: ""
    # For an https baseUrl only (leave empty for http): the CA that issued the
    # proxy's certificate, when it is self-signed or from a private CA. Name a Secret (e.g. cert-manager's, with ca.crt) or a
    # ConfigMap (e.g. a trust-manager bundle), not both. It is trusted in
    # addition to the system roots, and read at startup.
    ca:
      secretName: ""
      configMapName: ""
      key: ca.crt
  logging:
    # debug, info, warn or error.
    level: info
  # Pins a portal API to a gateway API handle when name + version matching
  # cannot tell which API is meant. Keys are "<name>:<version>" or the
  # portal's api ref_id, matched case-insensitively. The failed event's log
  # line names the exact key to add.
  apiHandles: {}
  #  "order api:v1.0": orderapi-1.0.0

# --- Credentials ------------------------------------------------------------
# The webhook secret and the gateway's admin credentials, injected as
# environment variables from a Kubernetes Secret.
secret:
  # Name of an existing Secret to read from (recommended). Create it outside
  # the chart - External Secrets Operator, the Azure Key Vault CSI driver,
  # Sealed Secrets, or kubectl - so the values never pass through Helm.
  existingSecret: ""
  # Keys inside that Secret.
  keys:
    webhookSecret: webhook-secret
    gatewayUsername: gateway-username
    gatewayPassword: gateway-password
  # Alternatively, let the chart create the Secret from the values below.
  # Convenient for development; in production it puts the credentials into
  # Helm's release history, so prefer existingSecret.
  create: false
  webhookSecret: ""
  gatewayUsername: ""
  gatewayPassword: ""

# --- Workload ---------------------------------------------------------------
# Two replicas keep a delivery target up through a restart, a rollout or a
# node drain. The API Portal never redelivers, so a delivery that finds no pod
# is lost until someone repeats the action in the portal.
replicaCount: 2

serviceAccount:
  create: true
  # Defaults to the release's full name.
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# On SIGTERM the mediator stops accepting webhooks and lets the deliveries it
# is applying finish, each within 25s; this leaves headroom for that.
terminationGracePeriodSeconds: 45

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# On startup the mediator probes the gateway for up to 15s before it starts
# listening, so the startup probe allows 60s before liveness takes over.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 30
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Extra environment variables for the container.
extraEnv: []
#  - name: SM_LOG_LEVEL
#    value: debug

# Lets a node drain or cluster upgrade evict one replica at a time, so a
# delivery target stays up. Needs replicaCount of 2 or more: with one replica,
# maxUnavailable 1 allows the only pod to be evicted.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# --- Networking -------------------------------------------------------------
# ClusterIP only: the API Portal runs in the same cluster, and every endpoint
# of the mediator is unauthenticated. Register this as the portal's webhook
# targetUrl:
#   http://<fullname>.<namespace>.svc:<service.port>/devportal/events
service:
  port: 8085
  annotations: {}

# A NetworkPolicy limiting traffic to and from the mediator. Strongly
# recommended in production; enabling it with no rules below allows no
# inbound traffic except the chart's own `helm test` pod.
networkPolicy:
  enabled: false
  ingress:
    # Who may call the mediator on its HTTP port: the API Portal's pods.
    from: []
    #  - namespaceSelector:
    #      matchLabels:
    #        kubernetes.io/metadata.name: api-portal
  egress:
    # Allow DNS lookups to any namespace's port 53.
    allowDNS: true
    # Where the mediator may connect: the Gateway Controller. Each entry is a
    # NetworkPolicyEgressRule.
    rules: []
    #  - to:
    #      - namespaceSelector:
    #          matchLabels:
    #            kubernetes.io/metadata.name: api-gateway
    #        podSelector:
    #          matchLabels:
    #            app.kubernetes.io/component: controller
    #    ports:
    #      - port: 9090
    #        protocol: TCP

# `helm test <release>` runs a pod that calls /health through the Service.
tests:
  enabled: true
