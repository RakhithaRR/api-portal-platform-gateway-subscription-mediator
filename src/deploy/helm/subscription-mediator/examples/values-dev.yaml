# Example: the dev environment on AKS, with the gateway and the API Portal in
# the same cluster. Copy it, replace every <...>, and install with:
#
#   helm upgrade --install subscription-mediator deploy/helm/subscription-mediator \
#     -n subscription-mediator -f values-dev.yaml \
#     --set image.tag=sha-<commit>
#
# The namespaces and labels below are examples; check yours with
#   kubectl get pods -A --show-labels

image:
  repository: <artifactory-host>/<docker-repo-key>/<path>/subscription-mediator
  # Set per deploy with --set image.tag=sha-<commit>, or pin a digest.
  tag: ""

# docker-registry Secret holding a pull-only Artifactory user or token; see the
# chart README, "Image pull".
imagePullSecrets:
  - name: artifactory-pull

config:
  gateway:
    # The controller serves its management API over plain HTTP on 9090; it has
    # no TLS listener of its own.
    baseUrl: http://<gateway-release>-gateway-controller.<gateway-namespace>.svc:9090/api/management/v1
    # Only when baseUrl is an https address of a TLS-terminating proxy or
    # ingress in front of the controller, with a self-signed or private-CA
    # certificate: the CA, copied into this namespace (e.g. by cert-manager or
    # trust-manager). Setting it with an http baseUrl stops startup.
    # ca:
    #   secretName: <gateway-ca-secret>
    #   key: ca.crt
  logging:
    level: info
  apiHandles: {}

secret:
  # Created outside the chart, e.g. synced from Azure Key Vault by External
  # Secrets Operator. Keys: webhook-secret, gateway-username, gateway-password.
  existingSecret: subscription-mediator-credentials

replicaCount: 2

networkPolicy:
  enabled: true
  ingress:
    from:
      # The API Portal, which delivers the webhooks.
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: <api-portal-namespace>
  egress:
    allowDNS: true
    rules:
      # The Gateway Controller management API.
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: <gateway-namespace>
        ports:
          - port: 9090
            protocol: TCP
