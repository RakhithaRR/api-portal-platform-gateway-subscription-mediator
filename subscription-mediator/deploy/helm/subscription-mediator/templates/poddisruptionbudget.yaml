{{- if .Values.podDisruptionBudget.enabled }}
# With one replica this blocks every voluntary eviction (node drains, cluster
# upgrades) until someone deletes the pod by hand. That is the point: the API
# Portal never redelivers a webhook, so an unplanned gap loses events. Enable
# it when you would rather a drain wait for a planned window.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "subscription-mediator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "subscription-mediator.labels" . | nindent 4 }}
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "subscription-mediator.selectorLabels" . | nindent 6 }}
{{- end }}
