{{- $fullname := include "subscription-mediator.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "subscription-mediator.labels" . | nindent 4 }}
spec:
  # The mediator keeps no state, so any replica can take any delivery.
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Bring the new pod up before taking an old one down, so a rollout
      # never leaves the portal with nothing to deliver to.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "subscription-mediator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "subscription-mediator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Config is read only at startup, so a config change rolls the pod.
        checksum/config: {{ include "subscription-mediator.configToml" . | sha256sum }}
        {{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "subscription-mediator.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: subscription-mediator
          image: {{ include "subscription-mediator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /etc/subscription-mediator/config.toml
          ports:
            # Fixed in the binary (0.0.0.0:8085).
            - name: http
              containerPort: 8085
              protocol: TCP
          env:
            - name: SM_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "subscription-mediator.secretName" . }}
                  key: {{ .Values.secret.keys.webhookSecret }}
            - name: SM_GATEWAY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "subscription-mediator.secretName" . }}
                  key: {{ .Values.secret.keys.gatewayUsername }}
            - name: SM_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "subscription-mediator.secretName" . }}
                  key: {{ .Values.secret.keys.gatewayPassword }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/subscription-mediator
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
