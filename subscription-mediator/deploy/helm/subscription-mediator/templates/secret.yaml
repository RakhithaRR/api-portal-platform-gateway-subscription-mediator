{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "subscription-mediator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "subscription-mediator.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secret.keys.webhookSecret }}: {{ required "secret.webhookSecret is required when secret.create=true" .Values.secret.webhookSecret | b64enc | quote }}
  {{ .Values.secret.keys.gatewayUsername }}: {{ required "secret.gatewayUsername is required when secret.create=true" .Values.secret.gatewayUsername | b64enc | quote }}
  {{ .Values.secret.keys.gatewayPassword }}: {{ required "secret.gatewayPassword is required when secret.create=true" .Values.secret.gatewayPassword | b64enc | quote }}
{{- end }}
